# separate terms of service, privacy policy, and support
# documentation.

name: CI Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      addons_skunk_ci_test_db:
        image: postgres:17@sha256:7958605b474b3d264a969cb3a123d6aa00ad1e1fe9da8a69984dabb704d93317
        env:
          POSTGRES_USER: ${{secrets.ADDONS_SKUNK_DB_CONFIG_USER}}
          POSTGRES_PASSWORD: ${{secrets.ADDONS_SKUNK_DB_CONFIG_PASSWORD}}
          POSTGRES_DB: addons_skunk_ci_test
        ports:
          - 5432:5432
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false # zizmor: avoid token persistence (artipacked)
    - name: Set up JDK 11
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: 'sbt'
    # ubuntu-24.04 dropped the preinstalled sbt that this workflow used to rely on.
    - name: Set up sbt
      uses: sbt/setup-sbt@8feba82adc7f01ddcf8165b86f778bdb5b82cebc # v1.5.7
    - name: Run tests
      env:
        ADDONS_SKUNK_DB_CONFIG_HOST: localhost
        ADDONS_SKUNK_DB_CONFIG_PORT: 5432
        ADDONS_SKUNK_DB_CONFIG_USER: ${{secrets.ADDONS_SKUNK_DB_CONFIG_USER}}
        ADDONS_SKUNK_DB_CONFIG_PASSWORD: ${{secrets.ADDONS_SKUNK_DB_CONFIG_PASSWORD}}
        ADDONS_SKUNK_DB_CONFIG_DATABASE: addons_skunk_ci_test
      run: sbt test
